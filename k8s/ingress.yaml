apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: email-automation
  namespace: email-automation
  labels:
    app.kubernetes.io/name: email-automation
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: email.padz.net
      http:
        paths:
          # API routes
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /health
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /ready
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          # Frontend (catch-all)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
