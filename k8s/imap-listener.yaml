apiVersion: apps/v1
kind: Deployment
metadata:
  name: imap-listener
  namespace: email-automation
  labels:
    app.kubernetes.io/name: email-automation
    app.kubernetes.io/component: imap-listener
spec:
  replicas: 1  # Single instance to avoid duplicate message detection
  strategy:
    type: Recreate  # Don't run two listeners simultaneously
  selector:
    matchLabels:
      app.kubernetes.io/name: email-automation
      app.kubernetes.io/component: imap-listener
  template:
    metadata:
      labels:
        app.kubernetes.io/name: email-automation
        app.kubernetes.io/component: imap-listener
    spec:
      serviceAccountName: email-automation
      containers:
        - name: imap-listener
          image: registry.container-registry.svc.cluster.local:32000/email-automation:latest
          command: ["./imap-listener"]
          env:
            - name: NATS_URL
              value: "nats://nats:4222"
            - name: IMAP_POLL_INTERVAL
              value: "5m"
            - name: IMAP_IDLE_TIMEOUT
              value: "25m"
            - name: LOG_LEVEL
              value: "info"
            - name: LOG_JSON
              value: "true"
          envFrom:
            - secretRef:
                name: email-automation-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            exec:
              command: ["test", "-f", "/proc/1/status"]
            initialDelaySeconds: 10
            periodSeconds: 30
