apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: email-automation
  labels:
    app.kubernetes.io/name: email-automation
    app.kubernetes.io/component: nats
spec:
  replicas: 1
  strategy:
    type: Recreate  # PVC can only be mounted by one pod
  selector:
    matchLabels:
      app.kubernetes.io/name: email-automation
      app.kubernetes.io/component: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: email-automation
        app.kubernetes.io/component: nats
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          ports:
            - containerPort: 4222
              name: client
            - containerPort: 8222
              name: monitoring
          args:
            - "--http_port=8222"
            - "--jetstream"
            - "--store_dir=/data/jetstream"
          volumeMounts:
            - name: jetstream-data
              mountPath: /data/jetstream
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: jetstream-data
          persistentVolumeClaim:
            claimName: nats-jetstream-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nats-jetstream-data
  namespace: email-automation
  labels:
    app.kubernetes.io/name: email-automation
    app.kubernetes.io/component: nats
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: email-automation
  labels:
    app.kubernetes.io/name: email-automation
    app.kubernetes.io/component: nats
spec:
  selector:
    app.kubernetes.io/name: email-automation
    app.kubernetes.io/component: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitoring
      port: 8222
      targetPort: 8222
