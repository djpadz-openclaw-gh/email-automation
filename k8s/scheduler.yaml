apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: email-automation
  labels:
    app.kubernetes.io/name: email-automation
    app.kubernetes.io/component: scheduler
spec:
  replicas: 1  # Single instance to avoid duplicate deferred action execution
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: email-automation
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: email-automation
        app.kubernetes.io/component: scheduler
    spec:
      serviceAccountName: email-automation
      containers:
        - name: scheduler
          image: registry.container-registry.svc.cluster.local:32000/email-automation:latest
          command: ["./scheduler"]
          env:
            - name: NATS_URL
              value: "nats://nats:4222"
            - name: SCHEDULER_INTERVAL
              value: "30s"
            - name: LOG_LEVEL
              value: "info"
            - name: LOG_JSON
              value: "true"
          envFrom:
            - secretRef:
                name: email-automation-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            exec:
              command: ["test", "-f", "/proc/1/status"]
            initialDelaySeconds: 10
            periodSeconds: 30
