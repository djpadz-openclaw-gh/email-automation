apiVersion: v1
kind: ConfigMap
metadata:
  name: email-automation-rules
  namespace: email-automation
  labels:
    app.kubernetes.io/name: email-automation
    app.kubernetes.io/component: rules
data:
  amazon.lua: |
    -- Rule: Amazon
    -- Move Amazon order/shipping emails older than 24 hours to @Amazon.
    -- Young Amazon emails (< 24h) return KEEP to prevent the receipts rule from grabbing them.
    
    local sender = email.sender_address:lower()
    local subject = email.subject:lower()
    
    local domains = {
        "amazon.com", "amazon.co.uk", "amazon.ca", "amazon.de",
        "amazon.fr", "amazon.co.jp", "amazon.com.au", "marketplace.amazon.com",
    }
    
    local keywords = {
        "your order", "order #", "order number", "has shipped", "order shipped",
        "out for delivery", "delivered", "your package", "your shipment",
        "arriving", "delivery", "confirm your order", "order confirmation",
        "order update", "review your upcoming", "subscribe & save",
    }
    
    -- Check sender domain
    local sender_match = false
    for _, domain in ipairs(domains) do
        if sender:find(domain, 1, true) then
            sender_match = true
            break
        end
    end
    
    if not sender_match then return skip() end
    
    -- Check subject keywords
    if not contains_any(subject, keywords) then return skip() end
    
    -- Hold in inbox until 24h old, then file
    if not older_than_hours(24) then
        return keep("Amazon order email, keeping until 24h old")
    end
    
    return move("@Amazon", "Amazon order/shipping email filed")
  atlassian.lua: |
    -- Rule: Atlassian
    -- Move Atlassian payment confirmation emails to @Receipts & Invoices.
    
    local sender = email.sender_address:lower()
    local subject = email.subject:lower()
    
    if not sender:find("atlassian.com", 1, true) then return skip() end
    if not subject:find("your payment has been processed", 1, true) then return skip() end
    
    return move("@Receipts & Invoices", "Atlassian payment confirmation")
  cal_responses.lua: |
    -- Rule: Calendar Responses
    -- Archive calendar accept/decline/tentative responses older than 24 hours.
    -- Only acts on messages that have a .ics attachment.
    
    local subject = email.subject
    
    if not older_than_hours(24) then return skip() end
    
    -- Check for response prefixes (case-sensitive, as in original)
    local prefixes = { "Accepted:", "Declined:", "Tentative:" }
    local prefix_match = false
    for _, prefix in ipairs(prefixes) do
        if subject:sub(1, #prefix) == prefix then
            prefix_match = true
            break
        end
    end
    
    if not prefix_match then return skip() end
    
    -- Check for .ics attachment
    if not has_ics() then return skip() end
    
    return archive("Calendar response with .ics attachment, older than 24h")
  contabo.lua: |
    -- Rule: Contabo
    -- Move Contabo billing emails to @Receipts.
    
    local sender = email.sender_address:lower()
    local subject = email.subject:lower()
    
    if not sender:find("contabo.com", 1, true) then return skip() end
    
    if not (subject:find("credit card payment", 1, true) or subject:find("invoice", 1, true)) then
        return skip()
    end
    
    return move("@Receipts", "Contabo billing email")
  crowdstrike.lua: |
    -- Rule: CrowdStrike
    -- Move CrowdStrike Intelligence Weekly Reports to @SaneNews.
    
    local sender = email.sender_address:lower()
    local subject = email.subject  -- case-sensitive check for "CSWR"
    
    if not sender:find("crowdstrike.com", 1, true) then return skip() end
    if not subject:find("CSWR", 1, true) then return skip() end
    
    return move("@SaneNews", "CrowdStrike weekly report")
  dmarc_reports.lua: |
    -- Rule: DMARC Reports
    -- Move DMARC aggregate reports to @30DayTrash immediately.
    
    local subject = email.subject:lower()
    
    -- Strip common email client prefixes like [Preview], [Fwd:], etc.
    subject = subject:gsub("^%s*%[[^%]]-]%s*", "")
    
    local phrases = {
        "report domain:",
        "dmarc aggregate report",
        "dmarc feedback report",
        "dmarc report for",
    }
    
    local match = false
    for _, phrase in ipairs(phrases) do
        if subject:find(phrase, 1, true) then
            match = true
            break
        end
    end
    
    if not match then return skip() end
    
    return move("@30DayTrash", "DMARC aggregate report")
  headway.lua: |
    -- Rule: Headway
    -- Delete Headway appointment reminder emails after the appointment day has passed.
    -- Falls back to deleting after 2 days if date can't be parsed.
    
    local sender = email.sender_address:lower()
    
    -- Check if sender is from Headway
    local headway_senders = {
        "noreply@e.headway.co",
        "no-reply@e.headway.co",
        "noreply@headway.co",
        "team@headway.co",
    }
    
    local is_headway = false
    for _, s in ipairs(headway_senders) do
        if sender == s or sender:find("headway.co", 1, true) then
            is_headway = true
            break
        end
    end
    
    if not is_headway then return skip() end
    
    -- Try to parse appointment date from subject (e.g., "on 3/24" or "on 12/5/2025")
    local subject = email.subject
    local month, day = subject:match("[Oo]n%s+(%d+)/(%d+)")
    
    if month and day then
        -- We have a date; the engine doesn't have full date parsing,
        -- so we use a conservative 2-day fallback
        if older_than_days(2) then
            return delete("Headway reminder, appointment date passed")
        end
    else
        -- Can't parse date, fall back to 2-day age
        if older_than_days(2) then
            return delete("Headway reminder, older than 2 days (no date parsed)")
        end
    end
    
    return skip()
  insight_marketing.lua: |
    -- Rule: Insight Marketing
    -- Move marketing emails from insight.com to @SaneNews.
    
    local sender = email.sender_address:lower()
    
    local senders = { "mktg.insight.com", "insight.com" }
    
    for _, s in ipairs(senders) do
        if sender:find(s, 1, true) then
            return move("@SaneNews", "Insight marketing email")
        end
    end
    
    return skip()
  ironport.lua: |
    -- Rule: IronPort Alerts
    -- Move original IronPort alert emails to @Ironport.
    -- Skip replies (Re:/Fwd:/etc.).
    
    local subject = email.subject or ""
    local sender = email.sender_address:lower()
    local sender_name = (email.sender_name or ""):lower()
    
    -- Skip replies
    if is_reply() then return skip() end
    
    -- Check sender patterns
    local sender_patterns = {
        "alert@mx%d+%.ctb%.padz%.net",
        "alert@sma%.ctb%.padz%.net",
    }
    
    local subject_keywords = {
        "ironport",
        "spam quarantine",
        "cisco secure email",
        "email security appliance",
    }
    
    local sender_match = false
    for _, pattern in ipairs(sender_patterns) do
        if sender:find(pattern) or sender_name:find(pattern) then
            sender_match = true
            break
        end
    end
    
    local subject_match = false
    local subject_l = subject:lower()
    for _, kw in ipairs(subject_keywords) do
        if subject_l:find(kw, 1, true) then
            subject_match = true
            break
        end
    end
    
    if not (sender_match or subject_match) then return skip() end
    
    return move("@Ironport", "IronPort alert email")
  login_codes.lua: |
    -- Rule: Login Codes
    -- Delete temporary login/verification code emails older than 1 hour.
    
    if not older_than_hours(1) then return skip() end
    
    local subject = email.subject:lower()
    local sender = email.sender_address:lower()
    
    local code_phrases = {
        "verification code", "verify your email", "verify your account",
        "your otp", "one-time password", "one-time code", "2fa code",
        "two-factor", "magic link", "sign-in code", "login code",
        "your code is", "your pin is", "temporary password",
        "reset your password", "password reset", "secure link to log in",
        "click to sign in", "click here to log in", "verifying it's you",
        "verifying its you", "confirm your email address", "confirm your identity",
        "confirm it's you", "confirm its you",
    }
    
    -- Direct subject match
    for _, phrase in ipairs(code_phrases) do
        if subject:find(phrase, 1, true) then
            return delete("Login/verification code email, older than 1h")
        end
    end
    
    -- Trusted auth sender + auth keyword match
    local trusted_senders = {
        "anthropic.com", "accounts.google.com", "account.microsoft.com",
        "github.com", "okta.com", "auth0.com", "onelogin.com", "atlassian.com",
    }
    
    local auth_keywords = {
        "sign in", "sign-in", "log in", "login", "verify",
        "verification", "authenticate", "access your account",
    }
    
    local is_trusted = false
    for _, domain in ipairs(trusted_senders) do
        if sender:find(domain, 1, true) then
            is_trusted = true
            break
        end
    end
    
    if is_trusted then
        for _, kw in ipairs(auth_keywords) do
            if subject:find(kw, 1, true) then
                return delete("Auth email from trusted sender, older than 1h")
            end
        end
    end
    
    return skip()
  morgan_stanley.lua: |
    -- Rule: Morgan Stanley
    -- Move Morgan Stanley notification emails older than 24 hours to @MorganStanley.
    
    local sender = email.sender_address:lower()
    local subject = email.subject:lower()
    
    if not sender:find("morganstanley.com", 1, true) then return skip() end
    
    local keywords = {
        "mobile check deposit", "deposit", "transfer", "statement",
        "transaction", "account alert", "account notice", "payment",
        "withdrawal", "confirmation",
    }
    
    local match = false
    for _, kw in ipairs(keywords) do
        if subject:find(kw, 1, true) then
            match = true
            break
        end
    end
    
    if not match then return skip() end
    
    if not older_than_hours(24) then
        return keep("Morgan Stanley notification, keeping until 24h old")
    end
    
    return move("@MorganStanley", "Morgan Stanley notification filed")
  rblmon.lua: |
    -- Rule: rblmon
    -- Delete rblmon.com "no blocks found" notification emails.
    -- Only deletes all-clear messages; keeps actual block alerts.
    
    local sender = email.sender_address:lower()
    
    if sender ~= "alert@rblmon.com" then return skip() end
    
    local subject = email.subject:lower()
    local preview = email.body_preview:lower()
    
    local no_block_phrases = {
        "no blocks", "no blacklist", "not listed", "not blocked",
        "all clear", "clean", "0 blacklists", "0 blocks", "found on 0",
    }
    
    for _, phrase in ipairs(no_block_phrases) do
        if subject:find(phrase, 1, true) or preview:find(phrase, 1, true) then
            return delete("rblmon all-clear notification")
        end
    end
    
    return skip()
  receipts.lua: |
    -- Rule: Receipts
    -- Move receipt/order confirmation emails to @Receipts.
    -- Uses subject keyword matching.
    
    local subject = email.subject:lower()
    local sender = email.sender_address:lower()
    
    -- Strong subject phrases that indicate a receipt regardless of sender
    local receipt_phrases = {
        "order confirmation", "order confirmed", "your order", "order #", "order number",
        "purchase confirmation", "purchase receipt", "payment confirmation", "payment receipt",
        "your receipt", "your invoice", "invoice #", "invoice number", "tax invoice",
        "your subscription confirmation", "your subscription receipt",
        "subscription confirmation", "subscription receipt", "subscription renewed",
        "renewal confirmation", "billing confirmation", "billing receipt",
        "transaction receipt", "has shipped", "your shipment", "shipment confirmation",
        "order shipped", "order has shipped", "your package", "delivery confirmation",
        "order delivered", "package delivered", "your download", "download receipt",
        "refund confirmation", "refund processed", "charge of",
        "you've been charged", "you have been charged",
        "payment successful", "payment was successful",
        "automatic payment", "autopayment", "invoice paid",
        "thank you for your payment", "auto reload is complete", "card auto reload",
    }
    
    for _, phrase in ipairs(receipt_phrases) do
        if subject:find(phrase, 1, true) then
            return move("@Receipts", "Receipt detected by subject keyword")
        end
    end
    
    -- Domain + subject keyword pairs (both must match)
    local domain_pairs = {
        { "amazon.com",       { "your order", "order #", "has shipped", "delivered", "invoice" } },
        { "apple.com",        { "your receipt", "invoice", "order" } },
        { "paypal.com",       { "receipt", "payment", "invoice", "transaction" } },
        { "stripe.com",       { "receipt", "invoice", "payment" } },
        { "shopify.com",      { "order", "receipt", "confirmation" } },
        { "etsy.com",         { "order", "receipt" } },
        { "ebay.com",         { "order", "invoice", "payment" } },
        { "walmart.com",      { "order", "receipt", "confirmation" } },
        { "target.com",       { "order", "receipt", "confirmation" } },
        { "bestbuy.com",      { "order", "receipt", "confirmation" } },
        { "costco.com",       { "order", "receipt" } },
        { "instacart.com",    { "receipt", "order" } },
        { "doordash.com",     { "receipt", "order" } },
        { "uber.com",         { "receipt", "trip" } },
        { "lyft.com",         { "receipt", "ride" } },
        { "grubhub.com",      { "receipt", "order" } },
        { "airbnb.com",       { "confirmation", "receipt", "booking" } },
        { "booking.com",      { "confirmation", "receipt", "booking" } },
        { "expedia.com",      { "confirmation", "itinerary", "receipt" } },
        { "hotels.com",       { "confirmation", "receipt" } },
        { "delta.com",        { "confirmation", "itinerary", "receipt", "e-ticket" } },
        { "united.com",       { "confirmation", "itinerary", "receipt", "e-ticket" } },
        { "southwest.com",    { "confirmation", "itinerary", "receipt" } },
        { "americanair.com",  { "confirmation", "itinerary", "receipt" } },
        { "github.com",       { "receipt", "invoice", "billing" } },
        { "docker.com",       { "receipt", "invoice", "billing", "payment" } },
        { "digitalocean.com", { "receipt", "invoice", "billing" } },
        { "aws.amazon.com",   { "invoice", "billing", "receipt" } },
        { "google.com",       { "receipt", "invoice", "billing", "order" } },
        { "microsoft.com",    { "receipt", "invoice", "billing", "order" } },
        { "netflix.com",      { "receipt", "invoice", "billing" } },
        { "spotify.com",      { "receipt", "invoice", "billing" } },
        { "hulu.com",         { "receipt", "invoice", "billing" } },
        { "openai.com",       { "receipt", "invoice", "billing" } },
        { "anthropic.com",    { "receipt", "invoice", "billing" } },
        { "contabo.com",      { "receipt", "invoice", "billing", "payment", "order" } },
        { "starbucks.com",    { "receipt", "invoice", "payment", "reload", "order", "auto reload" } },
    }
    
    for _, pair in ipairs(domain_pairs) do
        local domain = pair[1]
        local keywords = pair[2]
        if sender:find(domain, 1, true) then
            for _, kw in ipairs(keywords) do
                if subject:find(kw, 1, true) then
                    return move("@Receipts", "Receipt from " .. domain)
                end
            end
        end
    end
    
    return skip()
  sanebox.lua: |
    -- Rule: SaneBox
    -- Delete SaneBox daily digest/status emails older than 24 hours.
    
    if not older_than_hours(24) then return skip() end
    
    local sender = email.sender_address:lower()
    local subject = email.subject:lower()
    
    -- Match by sender domain
    if sender:find("sanebox.com", 1, true) then
        return delete("SaneBox digest, older than 24h")
    end
    
    -- Match by subject phrases
    local phrases = {
        "sanebox", "your sane", "sane digest", "sane black hole",
        "sanelater", "sane inbox", "emails you've missed", "digest from sanebox",
    }
    
    for _, phrase in ipairs(phrases) do
        if subject:find(phrase, 1, true) then
            return delete("SaneBox digest (subject match), older than 24h")
        end
    end
    
    return skip()
  scripps_video_visit.lua: |
    -- Rule: Scripps Video Visit
    -- Delete Scripps Health video visit direct join link emails after 24 hours.
    -- These are one-time-use telehealth join links.
    
    if not older_than_hours(24) then return skip() end
    
    local sender = email.sender_address:lower()
    
    local scripps_senders = {
        "myscrippsdonotreply@myscripps.org",
    }
    
    local is_scripps = false
    for _, s in ipairs(scripps_senders) do
        if sender == s then
            is_scripps = true
            break
        end
    end
    
    if not is_scripps then return skip() end
    
    local subject = email.subject:lower()
    local phrases = {
        "video visit direct join",
        "video visit join",
        "direct join link",
    }
    
    for _, phrase in ipairs(phrases) do
        if subject:find(phrase, 1, true) then
            return delete("Scripps video visit link, older than 24h")
        end
    end
    
    return skip()
  teams_notifications.lua: |
    -- Rule: Teams Notifications
    -- Delete Microsoft Teams notification emails older than 6 hours.
    
    if not older_than_hours(6) then return skip() end
    
    local sender = email.sender_address:lower()
    
    local teams_senders = {
        "no-reply@teams.microsoft.com",
        "noreply@teams.microsoft.com",
    }
    
    for _, s in ipairs(teams_senders) do
        if sender == s then
            return delete("Teams notification, older than 6h")
        end
    end
    
    return skip()
  usps_informed_delivery.lua: |
    -- Rule: USPS
    -- Move USPS emails older than 1 day to @30DayTrash.
    -- Covers Informed Delivery digests and shipping/tracking notifications.
    
    if not older_than_days(1) then return skip() end
    
    local sender = email.sender_address:lower()
    
    local usps_senders = {
        "informeddelivery@usps.gov",
        "informeddelivery@email.usps.gov",
        "auto-reply@usps.com",
    }
    
    local usps_domains = {
        "usps.gov",
        "email.informeddelivery.usps.gov",
    }
    
    local is_usps = false
    
    for _, s in ipairs(usps_senders) do
        if sender == s then
            is_usps = true
            break
        end
    end
    
    if not is_usps then
        for _, d in ipairs(usps_domains) do
            if ends_with(sender, d) then
                is_usps = true
                break
            end
        end
    end
    
    if not is_usps then return skip() end
    
    return move("@30DayTrash", "USPS email, older than 1 day")
  venmo.lua: |
    -- Rule: Venmo
    -- Move Venmo "you paid" notification emails older than 2 days to @Receipts.
    
    if not older_than_days(2) then return skip() end
    
    local sender = email.sender_address:lower()
    local subject = email.subject:lower()
    
    local venmo_senders = {
        "venmo@venmo.com",
        "no-reply@venmo.com",
        "noreply@venmo.com",
    }
    
    local is_venmo = false
    for _, s in ipairs(venmo_senders) do
        if sender == s then
            is_venmo = true
            break
        end
    end
    
    if not is_venmo then
        if ends_with(sender, "@venmo.com") then
            is_venmo = true
        end
    end
    
    if not is_venmo then return skip() end
    
    if not subject:find("you paid", 1, true) then return skip() end
    
    return move("@Receipts", "Venmo payment notification, older than 2 days")
