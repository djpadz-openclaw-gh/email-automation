apiVersion: v1
kind: Secret
metadata:
  name: email-automation-secrets
  namespace: email-automation
  labels:
    app.kubernetes.io/name: email-automation
type: Opaque
stringData:
  # System admin API key
  API_KEY: "CHANGE_ME_admin_key"

  # PostgreSQL
  DATABASE_URL: "postgres://emailauto:87cb60e125b0a344f3b7ce41f25225c7@postgres:5432/emailauto?sslmode=disable"
  POSTGRES_PASSWORD: "87cb60e125b0a344f3b7ce41f25225c7"

  # Telegram notifications
  TELEGRAM_BOT_TOKEN: ""
  TELEGRAM_CHAT_ID: ""

  # JWT Authentication
  JWT_SECRET: "CHANGE_ME_generate_a_secure_random_string"
  JWT_EXPIRATION: "24h"

  # WebAuthn / Passkeys
  WEBAUTHN_RP_ID: "email.padz.net"
  WEBAUTHN_RP_DISPLAY_NAME: "Email Automation"
  WEBAUTHN_RP_ORIGINS: "https://email.padz.net"

  # Rate limiting
  RATE_LIMIT_WINDOW: "15m"
  RATE_LIMIT_MAX_FAILS: "10"

  # Kiro API (local gateway)
  KIRO_API_URL: "http://10.152.183.204:9000"
  KIRO_API_KEY: "aing3Maiwiex0wie3loip9yee0iengo"

  # OAuth2 - Microsoft 365 (values applied via kubectl, see deploy notes)
  OAUTH2_MS365_CLIENT_ID: "REPLACE_VIA_KUBECTL"
  OAUTH2_MS365_CLIENT_SECRET: "REPLACE_VIA_KUBECTL"
  OAUTH2_MS365_TENANT_ID: "common"

  # OAuth2 - Gmail (values applied via kubectl, see deploy notes)
  OAUTH2_GMAIL_CLIENT_ID: "REPLACE_VIA_KUBECTL"
  OAUTH2_GMAIL_CLIENT_SECRET: "REPLACE_VIA_KUBECTL"

  # OAuth2 - Redirect base URL
  OAUTH2_REDIRECT_BASE_URL: "https://email.padz.net"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: email-automation
  labels:
    app.kubernetes.io/name: email-automation
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  POSTGRES_USER: "emailauto"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: "emailauto"
