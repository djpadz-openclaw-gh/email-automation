apiVersion: v1
kind: Secret
metadata:
  name: email-automation-secrets
  namespace: email-automation
  labels:
    app.kubernetes.io/name: email-automation
type: Opaque
stringData:
  # System admin API key
  API_KEY: "CHANGE_ME_admin_key"

  # PostgreSQL
  DATABASE_URL: "postgres://emailauto:CHANGE_ME@postgres:5432/emailauto?sslmode=disable"
  POSTGRES_PASSWORD: "CHANGE_ME"

  # Telegram notifications
  TELEGRAM_BOT_TOKEN: ""
  TELEGRAM_CHAT_ID: ""

  # JWT Authentication
  JWT_SECRET: "CHANGE_ME_generate_a_secure_random_string"
  JWT_EXPIRATION: "24h"

  # WebAuthn / Passkeys
  WEBAUTHN_RP_ID: "email.padz.net"
  WEBAUTHN_RP_DISPLAY_NAME: "Email Automation"
  WEBAUTHN_RP_ORIGINS: "https://email.padz.net"

  # Rate limiting
  RATE_LIMIT_WINDOW: "15m"
  RATE_LIMIT_MAX_FAILS: "10"

  # Kiro API (local gateway)
  KIRO_API_URL: "http://10.152.183.204:9000"
  KIRO_API_KEY: "aing3Maiwiex0wie3loip9yee0iengo"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: email-automation
  labels:
    app.kubernetes.io/name: email-automation
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  POSTGRES_USER: "emailauto"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: "emailauto"
